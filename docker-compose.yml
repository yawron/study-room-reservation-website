services:
  postgres:
    image: postgres:17-alpine
    container_name: starstudy-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: starstudy
      POSTGRES_PASSWORD: starstudy_dev
      POSTGRES_DB: starstudy
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
